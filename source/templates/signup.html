<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · Organic Sound</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Organic Sound</span>
      </div>
      <h1>Create your account</h1>
      <p class="subtitle">AI-powered song recommendations from your live Spotify session.</p>

      <div id="flash" class="flash"></div>

      <form id="signup-form" autocomplete="on">
        <div class="form-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="4" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign up</button>
      </form>

      <div class="alt-action">
        Already have an account? <a href="{{ url_for('login_page') }}">Log in</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('signup-form');
    const flash = document.getElementById('flash');
    const submitBtn = document.getElementById('submit-btn');

    function showFlash(message, type = 'error') {
      flash.textContent = message;
      flash.className = `flash ${type} show`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Creating account';

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          showFlash(data.error || 'Sign up failed');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign up';
          return;
        }
        showFlash('Account created. Redirecting to login…', 'success');
        setTimeout(() => { window.location.href = '/login'; }, 700);
      } catch (err) {
        showFlash('Network error. Try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign up';
      }
    });
  </script>
</body>
</html>
